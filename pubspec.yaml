name: expense_tracker
description: A personal expense tracker
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI Icons
  cupertino_icons: ^1.0.6
  
  # Local Database
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.1
  
  # Date formatting
  intl: ^0.18.1
  
  # Images - ONLY image_picker is needed!
  image_picker: ^1.0.5
  
  # Security
  flutter_secure_storage: ^9.0.0
  # local_auth: ^2.1.8
  
  # UI Components
  
  # Charts
  fl_chart: ^0.64.0
  
  # Permissions

  # For device sync
  network_info_plus: ^4.1.0        # Get device IP and network info
  connectivity_plus: ^5.0.2        # Check internet/wifi connectivity
  bonsoir: ^5.1.0                   # Service discovery (find devices on network)
  shared_preferences: ^2.2.2        # Store sync settings

  # for reminder
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  crypto: ^3.0.7
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/logo.png"
  remove_alpha_ios: true
  
  # ✅ CORRECT WINDOWS CONFIGURATION (as a Map, not boolean)
  windows:
    generate: true
    icon_size: 48  # Min 48, Max 256
    image_path: "assets/icon/logo.png"  # Optional: specific icon for Windows

flutter:
  uses-material-design: true